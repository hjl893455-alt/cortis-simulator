<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17151d">
  <meta name="description" content="CORTIS 恋爱模拟器——虚构平行世界互动小说，支持多人联机一起投票推剧情">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=9">
  <title>CORTIS · 恋爱模拟器</title>
</head>
<body>
  <div id="statusbar"><span id="sb-time">9:41</span><span class="sb-right">5G&nbsp;&nbsp;▂▄▆&nbsp;&nbsp;🔋</span></div>
  <main class="app-shell">
    <section id="lockscreen" class="screen lockscreen" hidden>
      <div class="lock-time" id="lock-time">9:41</div>
      <div class="lock-date" id="lock-date"></div>
      <div class="lock-hint">点击任意处解锁 →</div>
    </section>
    <section id="onboarding" class="screen onboarding">
      <h1>CORTIS · 恋爱模拟器</h1>
      <p class="ob-sub">30 秒，开始你的故事</p>
      <form id="setup-form">
        <label class="fld">你的昵称<div class="name-row"><input id="player-name" maxlength="18" placeholder="输入昵称"><button type="button" id="rand-name">🎲 随机</button></div></label>
        <div class="two-col">
          <label class="fld">年龄<select id="player-age"><option>随便</option><option>18–22</option><option>23–26</option><option>27–30</option><option value="custom">自定义…</option></select><input id="player-age-custom" class="custom-input" maxlength="16" placeholder="例如：25 岁" hidden></label>
          <label class="fld">国籍<select id="player-country"><option>随便</option><option>中国</option><option>韩国</option><option>美国</option><option>其他</option><option value="custom">自定义…</option></select><input id="player-country-custom" class="custom-input" maxlength="16" placeholder="例如：日本" hidden></label>
        </div>
        <div class="two-col">
          <label class="fld">性格<select id="player-traits"><option>随便</option><option>开朗外向</option><option>温柔体贴</option><option>高冷慢热</option><option>幽默风趣</option><option>认真靠谱</option><option value="custom">自定义…</option></select><input id="player-traits-custom" class="custom-input" maxlength="30" placeholder="例如：外冷内热" hidden></label>
          <label class="fld">职业<select id="player-job"><option>随便</option><option>学生</option><option>公司新人</option><option>练习生</option><option>自由职业</option><option value="custom">自定义…</option></select><input id="player-job-custom" class="custom-input" maxlength="24" placeholder="例如：咖啡师" hidden></label>
        </div>
        <label class="fld">选择心动对象<div id="member-picker" class="member-picker"></div></label>
        <button class="primary" type="submit" id="start-btn">进入游戏 <b>→</b></button>
      </form>
    </section>
    <section id="game" class="screen game" hidden>
      <div id="member-bar"></div>
      <header id="g-head">
        <span id="g-avatar">😐</span>
        <div class="g-head-main">
          <div class="g-head-topline"><strong id="g-name"></strong><small id="g-mood"></small></div>
          <div class="g-head-affline"><span>好感 <b id="g-affnum">0 / 100</b></span><span id="g-days"></span><button id="g-scene-btn" type="button">换场景</button></div>
          <div id="g-track"><div id="g-fill"></div></div>
        </div>
      </header>
      <div id="g-flow"></div>
      <div id="g-quick"></div>
      <div id="g-dock"><textarea id="g-input" rows="1" maxlength="200" placeholder="说点什么…"></textarea><button id="g-send" type="button">发送</button></div>
      <div id="g-win" hidden><div class="g-win-card"><div class="g-win-emoji">🥰</div><h2 class="g-win-title">他彻底心动了！</h2><p class="g-win-text"></p><button id="g-win-ok" type="button">继续聊天</button></div></div>
    </section>
  </main>

  <dialog id="panel-dialog"><button id="close-dialog" class="close">×</button><div id="dialog-content"></div></dialog>
  <script src="game.js?v=9"></script>
  <script src="phone.js?v=9"></script>
</body>
</html>
